<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#10b981;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#10b981;#38bdf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <style>
      @keyframes floatUpSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatDownSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes gridShimmer {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.18; }
      }
      .anim-float1 { animation: floatUpSlow 5s ease-in-out infinite; }
      .anim-float2 { animation: floatDownSlow 6s ease-in-out infinite; }
      .anim-float3 { animation: floatUpSlow 7s ease-in-out infinite 1s; }
      .anim-float4 { animation: floatDownSlow 5.5s ease-in-out infinite 0.5s; }
      .anim-pulse { animation: pulseAura 6s ease-in-out infinite; transform-origin: center; }
      .anim-grid { animation: gridShimmer 4s ease-in-out infinite; }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs / Glows -->
  <g class="anim-pulse" opacity="0.45">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glowFilter)" opacity="0.3" />
    <circle cx="1020" cy="280" r="150" fill="#a855f7" filter="url(#glowFilter)" opacity="0.3" />
    <circle cx="600" cy="180" r="180" fill="#6366f1" filter="url(#glowFilter)" opacity="0.2" />
  </g>

  <!-- Geometric Grid Pattern (Subtle) -->
  <g class="anim-grid" stroke="#64748b" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Animated Floating Pills (Flanking Sides - keeping center clear) -->
  <!-- Left Side Pills -->
  <g class="anim-float1">
    <g filter="url(#pillShadow)" transform="translate(60, 65)">
      <rect width="170" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="19" r="6" fill="#38bdf8" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">📦 SCORM 2004 / 1.2</text>
    </g>
  </g>

  <g class="anim-float2">
    <g filter="url(#pillShadow)" transform="translate(75, 145)">
      <rect width="155" height="38" rx="19" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="19" r="6" fill="#a855f7" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">⚡ xAPI &amp; cmi5</text>
    </g>
  </g>

  <g class="anim-float3">
    <g filter="url(#pillShadow)" transform="translate(50, 225)">
      <rect width="180" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="19" r="6" fill="#10b981" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">📱 HTML5 Responsive</text>
    </g>
  </g>

  <!-- Right Side Pills -->
  <g class="anim-float2">
    <g filter="url(#pillShadow)" transform="translate(970, 65)">
      <rect width="170" height="38" rx="19" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="19" r="6" fill="#f59e0b" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">🤖 AI Course Gen</text>
    </g>
  </g>

  <g class="anim-float1">
    <g filter="url(#pillShadow)" transform="translate(950, 145)">
      <rect width="190" height="38" rx="19" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="19" r="6" fill="#ec4899" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">🎬 Interactive Video</text>
    </g>
  </g>

  <g class="anim-float4">
    <g filter="url(#pillShadow)" transform="translate(975, 225)">
      <rect width="165" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="19" r="6" fill="#38bdf8" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">🌐 Self-Hosted &amp; SaaS</text>
    </g>
  </g>

  <!-- Foreground Center Content (Guaranteed foreground layering) -->
  <!-- Category Tag / Top Badge -->
  <g transform="translate(470, 52)">
    <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <text x="130" y="20" fill="#a5b4fc" class="badge-text" text-anchor="middle" font-size="11" letter-spacing="1.5">🎓 CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="142" text-anchor="middle" fill="url(#titleGrad)" class="title-text" font-size="44" filter="url(#textGlow)">
    Awesome E-Learning Authoring
  </text>
  <text x="600" y="188" text-anchor="middle" fill="#ffffff" class="title-text" font-size="36" letter-spacing="0">
    Software &amp; Tools Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="600" y="235" text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="16.5">
    Curated SaaS Platforms, Open-Source Frameworks &amp; Interactive Content Engines
  </text>
  <text x="600" y="265" text-anchor="middle" fill="#64748b" class="sub-text" font-size="14">
    For Instructional Designers, L&amp;D Professionals, Educators &amp; Developers
  </text>

  <!-- Glowing Bottom Accent Line -->
  <g transform="translate(350, 305)">
    <rect width="500" height="3" rx="1.5" fill="url(#glowPulse)" />
    <circle cx="250" cy="1.5" r="5" fill="#38bdf8">
      <animate attributeName="cx" values="30;470;30" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
